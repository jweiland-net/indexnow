services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    JWeiland\IndexNow\Notifier\Submitter\UrlSubmitterInterface:
      tags: ['indexnow.url_submitter']

  JWeiland\IndexNow\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'
      - '../Classes/Event/*'
      - '../Classes/Configuration/Exception/*'

  JWeiland\IndexNow\Notifier\SearchEngineNotifier:
    arguments:
      $urlSubmitters: !tagged_iterator indexnow.url_submitter
